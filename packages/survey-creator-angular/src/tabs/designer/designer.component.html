<ng-template #template>
  <div class="svc-flex-column">
    <ng-container *ngIf="model.isToolboxVisible">
      <ng-template [component]="{name: 'svc-toolbox', data: { model: creator }}"></ng-template>
    </ng-container>
  </div>
  <div class="svc-tab-designer" [class]="model.getRootCss()" (click)="model.clickDesigner()">
    <sv-scroll>
      <div class="svc-tab-designer_content">
        <ng-container *ngIf="model.showPlaceholder">
          <div *ngIf="creator.showHeaderInEmptySurvey && creator.showSurveyHeader" class="svc-designer-header">
            <div *ngIf="survey.renderedHasHeader" [class]="survey.css.header" [survey]="survey" sv-ng-survey-header>
            </div>
          </div>
          <div class="svc-designer__placeholder-container" [attr.data-sv-drop-target-survey-element]="'newGhostPage'">
            <svc-surface-placeholder [name]="'designer'" [placeholderTitleText]="model.placeholderTitleText"
              [placeholderDescriptionText]="model.placeholderDescriptionText">
            </svc-surface-placeholder>
            <svc-page-wrapper [page]="model.newPage" [creator]="creator" [isGhost]="true" [className]="'svc-designer-placeholder-page'"></svc-page-wrapper>
          </div>
        </ng-container>
        <ng-container *ngIf="!model.showPlaceholder">
          <div [class]="model.designerCss" [attr.style]="surfaceCssVariablesString">
            <div *ngIf="creator.showSurveyHeader" class="svc-designer-header">
              <div *ngIf="survey.renderedHasHeader" [class]="survey.css.header" [survey]="survey" sv-ng-survey-header></div>
            </div>
            <ng-container *ngIf="creator.pageEditMode !== 'bypage'">
              <ng-container *ngFor="let page of model.pages; trackBy: trackPageBy ">
                <svc-page-wrapper [page]="page" [creator]="creator" [isGhost]="model.newPage == page" [className]="'svc-page'"></svc-page-wrapper>
              </ng-container>
            </ng-container>
            <ng-container *ngIf="model.pagesController.page2Display && creator.pageEditMode === 'bypage'">
              <svc-page-wrapper [page]="model.pagesController.page2Display" [creator]="creator" [isGhost]="model.pagesController.page2Display == model.newPage" [className]="'svc-page'"></svc-page-wrapper>
            </ng-container>
          </div>
          <div *ngIf="model.showSurfaceTools" class="svc-tab-designer__tools">
            <div *ngIf="creator.showPageNavigator" class="svc-tab-designer__page-navigator">
              <svc-page-navigator [pagesController]="model.pagesController" [pageEditMode]="creator.pageEditMode">
              </svc-page-navigator>
            </div>
            <div *ngIf="model.showSurfaceToolbar" class="svc-tab-designer__toolbar">
              <sv-action-bar [model]="model.surfaceToolbar"></sv-action-bar>
            </div>
          </div>
        </ng-container>
      </div>
    </sv-scroll>
  </div>
</ng-template>
