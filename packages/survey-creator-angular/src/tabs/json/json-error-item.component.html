<ng-template #template>
    <svg [iconName]="model.iconName" [size]="model.iconSize" [css]="'svc-json-error__icon'" sv-ng-svg-icon></svg>
    <div class="svc-json-error__container">
        <div class="svc-json-error__title" [attr.title]="model.data.error?.text" (mousedown)="onTitleMouseDown($event)">
            <sv-ng-string [model]="model.locTitle"></sv-ng-string>
        </div>
        <sv-action-bar [model]="model.data.actions"></sv-action-bar>
    </div>
</ng-template>
