<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Survey Creator rich text</title>
  <script src="./node_modules/react/umd/react.development.js"></script>
  <script src="./node_modules/react-dom/umd/react-dom.development.js"></script>
  <script src="./node_modules/survey-core/survey.core.js"></script>
  <script src="./node_modules/survey-core/survey.i18n.min.js"></script>
  <script src="./node_modules/survey-core/themes/index.js"></script>
  <script>
    (function () {
      var pluginOff = /[?&]plugin=off(?:&|$)/.test(location.search);
      window.__richTextPlugin = !pluginOff;
      if (pluginOff) return;
      document.write("<link rel=\"stylesheet\" href=\"./node_modules/survey-core/rich-text.css\" />");
      document.write("<script src=\"./node_modules/survey-core/rich-text/index.js\"><\/script>");
    })();
  </script>
  <script src="./node_modules/survey-react-ui/survey-react-ui.js"></script>
  <script src="./node_modules/survey-creator-core/survey-creator-core.js"></script>
  <script src="./node_modules/survey-creator-core/survey-creator-core.i18n.min.js"></script>
  <script src="./build/survey-creator-react.js"></script>
  <link rel="stylesheet" href="./node_modules/survey-core/survey-core.css" />
  <link rel="stylesheet" href="./node_modules/survey-creator-core/survey-creator-core.css" />
  <link rel="stylesheet" href="./fonts.css" />
  <style>
    html, body { margin: 0; height: 100%; }
    body { display: flex; font-family: "Open Sans", sans-serif; }
    #creatorElement { flex: 1; min-width: 0; position: relative; }
    #richTextPanel {
      width: 300px;
      box-sizing: border-box;
      padding: 12px;
      overflow: auto;
      border-left: 1px solid #d0d0d0;
      background: #f7f7f7;
      font-size: 13px;
    }
    #richTextPanel h2 { margin: 16px 0 8px; font-size: 14px; }
    #richTextPanel h2:first-child { margin-top: 0; }
    #richTextPanel label { display: block; margin: 0 0 8px; }
    #richTextPanel p { margin: 8px 0; }
    #richTextPanel .plugin-only { display: none; }
    body.plugin-on #richTextPanel .plugin-only { display: block; }
  </style>
</head>

<body>
  <div id="creatorElement"></div>
  <aside id="richTextPanel">
    <h2>Setup</h2>
    <p id="pluginState"></p>
    <div class="plugin-only">
      <label><input type="checkbox" id="registerEditor" checked /> registerRichTextEditor</label>
      <label><input type="checkbox" id="designerHandler" checked /> onTextMarkdown on the designer survey</label>
      <p>Rich strings: <strong id="richState"></strong></p>
      <p>The handler is also attached to preview, theme, translation source and target, and the matrix cell popup. The property grid, dialogs and the translation grid are not wired.</p>
    </div>
    <p>Open <a href="?plugin=off">?plugin=off</a> for Creator without the plugin.</p>
  </aside>
  <script>
    var demoJson = {
      "title": "Rich text <strong>demo</strong>",
      "description": "<p>Survey description with <em>italic</em> text.</p><p>Second paragraph.</p>",
      "pages": [
        {
          "name": "strings",
          "title": "Strings",
          "elements": [
            {
              "type": "text", "name": "s1",
              "title": "Title with <em>italic</em>, <strong>bold</strong>, <s>strike</s> and <a href=\"https://surveyjs.io\">a link</a>",
              "description": "<p>Line one<br>Line two</p><ul><li>item one</li><li>item two</li></ul>"
            },
            {
              "type": "radiogroup", "name": "s2", "title": "Plain title",
              "choices": ["<strong>Bold</strong> choice", "Plain choice", "Markdown **is not** rendered", "Tom & Jerry"]
            },
            { "type": "text", "name": "s3", "title": "Raw <b>html</b> and \u003cscript\u003ealert(1)\u003c/script\u003e" },
            { "type": "text", "name": "s4", "title": "<a href=\"javascript:alert(1)\">js link</a>" },
            { "type": "text", "name": "s5", "title": "Table", "description": "<table><tr><td>a</td><td>b</td></tr><tr><td>1</td><td>2</td></tr></table>" },
            { "type": "text", "name": "s6", "title": "<ul><li>a list</li><li>in a title</li></ul>" },
            {
              "type": "text", "name": "s7", "title": "Styled string",
              "description": "<p style=\"color:red\">Red</p><table><tr><td>cell</td></tr></table>"
            },
            { "type": "text", "name": "s8", "title": "Plain multi-line description", "description": "Plain line one\nPlain line two" }
          ]
        },
        {
          "name": "editor",
          "title": "Editor",
          "elements": [
            { "type": "comment", "name": "c_md", "title": "Rich answer", "allowRichText": true, "placeholder": "Type and format text" },
            { "type": "comment", "name": "c_typing", "title": "Updates while typing", "allowRichText": true, "textUpdateMode": "onTyping" },
            {
              "type": "comment", "name": "c_legacy", "title": "Plain answer from before rich text", "allowRichText": true,
              "defaultValue": "Typed in a textarea: a < b & c\nSecond line"
            },
            { "type": "comment", "name": "c_inline", "title": "Inline mode", "allowRichText": true, "acceptCarriageReturn": false },
            { "type": "comment", "name": "c_max", "title": "Max length 50", "allowRichText": true, "maxLength": 50 },
            { "type": "comment", "name": "c_rows", "title": "Rows, autoGrow, resize", "allowRichText": true, "rows": 6, "autoGrow": true, "allowResize": true },
            {
              "type": "comment", "name": "c_unsupported", "title": "Unsupported stored content", "allowRichText": true,
              "defaultValue": "<p style=\"color:red\">Red</p><table><tr><td>cell</td></tr></table>"
            },
            {
              "type": "matrixdropdown", "name": "m1", "title": "Matrix with a rich comment cell",
              "columns": [{ "name": "notes", "cellType": "comment", "allowRichText": true }],
              "rows": ["Row 1"]
            }
          ]
        }
      ]
    };

    var richTextAreas = [
      "designer-tab", "preview-tab", "theme-tab", "translation-tab:source-survey",
      "translation-tab:target-survey", "matrix-cell-question-popup-editor"
    ];
    var creator = null;
    var generation = 0;

    function renderCreator(json) {
      var pluginOn = !!window.__richTextPlugin;
      var registerEditor = pluginOn && document.getElementById("registerEditor").checked;
      var designerHandler = pluginOn && document.getElementById("designerHandler").checked;
      var previous = creator;
      creator = new SurveyCreator.SurveyCreator({
        showTranslationTab: true,
        showThemeTab: true,
        showLogicTab: true,
        translationMode: "sideBySide"
      });
      if (registerEditor) {
        creator.registerRichTextEditor(SurveyRichText.RichText);
      }
      if (pluginOn) {
        creator.onSurveyInstanceCreated.add(function (_sender, options) {
          if (richTextAreas.indexOf(options.area) < 0) return;
          if (options.area === "designer-tab" && !designerHandler) return;
          options.survey.onTextMarkdown.add(SurveyRichText.RichText.renderStringHandler);
        });
      }
      creator.JSON = json || demoJson;
      window.creator = creator;
      generation += 1;
      ReactDOM.render(
        React.createElement(SurveyCreator.SurveyCreatorComponent, { creator: creator, key: String(generation) }),
        document.getElementById("creatorElement")
      );
      if (previous) previous.dispose();
      var richState = document.getElementById("richState");
      if (richState) richState.textContent = creator.isRichStringsEnabled() ? "on" : "off";
    }

    SurveyCreatorCore.registerSurveyTheme(SurveyTheme);
    SurveyCreatorCore.registerCreatorTheme(SurveyTheme);
    document.body.className = window.__richTextPlugin ? "plugin-on" : "";
    document.getElementById("pluginState").textContent = window.__richTextPlugin ? "Plugin loaded." : "Plugin off. No editor and no string handler.";
    document.getElementById("registerEditor").addEventListener("change", function () {
      renderCreator(creator ? creator.JSON : demoJson);
    });
    document.getElementById("designerHandler").addEventListener("change", function () {
      renderCreator(creator ? creator.JSON : demoJson);
    });
    renderCreator(demoJson);
  </script>
</body>

</html>
