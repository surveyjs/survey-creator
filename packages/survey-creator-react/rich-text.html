<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Survey Creator rich text</title>
  <script src="./node_modules/react/umd/react.development.js"></script>
  <script src="./node_modules/react-dom/umd/react-dom.development.js"></script>
  <script src="./node_modules/survey-core/survey.core.js"></script>
  <script src="./node_modules/survey-core/themes/index.js"></script>
  <link rel="stylesheet" href="./node_modules/survey-core/rich-text.css" />
  <script src="./node_modules/survey-core/rich-text/index.js"></script>
  <script src="./node_modules/survey-react-ui/survey-react-ui.js"></script>
  <script src="./node_modules/survey-creator-core/survey-creator-core.js"></script>
  <script src="./build/survey-creator-react.js"></script>
  <link rel="stylesheet" href="./node_modules/survey-core/survey-core.css" />
  <link rel="stylesheet" href="./node_modules/survey-creator-core/survey-creator-core.css" />
  <link rel="stylesheet" href="./fonts.css" />
  <style>
    html, body { margin: 0; height: 100%; }
    #creatorElement { height: 100%; }
  </style>
</head>

<body>
  <div id="creatorElement"></div>
  <script>
    // Rich text editing follows the serializer type: "html" is a block, "inlinehtml" is one line.
    // Other types stay plain text. Change the type here to turn a string into a rich editor.
    Survey.Serializer.findProperty("survey", "title").type = "inlinehtml";
    Survey.Serializer.findProperty("question", "title").type = "html";
    Survey.Serializer.findProperty("itemvalue", "text").type = "inlinehtml";

    function renderRichString(_sender, options) {
      var owner = options.item || options.element;
      var typeName = owner && typeof owner.getType === "function" ? owner.getType() : "";
      var prop = typeName ? Survey.Serializer.findProperty(typeName, options.name) : null;
      var type = prop && prop.type;
      if (type !== "html" && type !== "inlinehtml") return;
      var html = SurveyRichText.RichText.sanitizeHtml(options.text, { inline: type === "inlinehtml" });
      if (html !== options.text || /<[A-Za-z/!?]/.test(html)) options.html = html;
    }

    SurveyCreatorCore.registerSurveyTheme(SurveyTheme);
    SurveyCreatorCore.registerCreatorTheme(SurveyTheme);

    var creator = new SurveyCreator.SurveyCreator({ showLogicTab: false });
    creator.registerRichTextEditor(SurveyRichText.RichText);
    creator.onSurveyInstanceCreated.add(function (_sender, options) {
      options.survey.onTextMarkdown.add(renderRichString);
    });
    creator.JSON = {
      title: "Rich text <strong>demo</strong>",
      description: "Plain description. Tags such as <em>this</em> stay text.",
      elements: [
        {
          type: "text",
          name: "q1",
          title: "<p>Title with <em>italic</em>, <strong>bold</strong> and <a href=\"https://surveyjs.io\">a link</a></p><ul><li>item one</li><li>item two</li></ul>",
          description: "<p>This description is a plain string.</p>"
        },
        {
          type: "radiogroup",
          name: "q2",
          title: "Choices use inline HTML",
          choices: ["<strong>Bold</strong> choice", "Plain choice"]
        },
        {
          type: "richtext",
          name: "answer",
          title: "Rich answer",
          placeholder: "Type and format text"
        }
      ]
    };

    ReactDOM.render(
      React.createElement(SurveyCreator.SurveyCreatorComponent, { creator: creator }),
      document.getElementById("creatorElement")
    );
  </script>
</body>

</html>
