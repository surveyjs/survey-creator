<!DOCTYPE html>
<html lang="en">

<head>
  <!-- Strict CSP mirroring a customer policy: nonce-based style-src, self-only fonts/images.
       Meta CSP does not support report-uri, so violations are collected via the
       securitypolicyviolation event (see the first inline script below).
       https://esm.sh is allowed in script-src because React 19 ships no UMD build and is
       loaded as an ES module from there, same as the other react test pages. -->
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self' 'nonce-testNonce123' https://esm.sh 'report-sample'; style-src 'self' 'nonce-testNonce123' 'report-sample'; font-src 'self'; img-src 'self'" />
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <script nonce="testNonce123">
    // Must be registered before any bundle loads so that violations raised while
    // parsing vendor CSS / running vendor JS are captured.
    window.__cspViolations = [];
    // The test sets __cspPhase before each interaction so every violation can be
    // attributed to the step that triggered it.
    window.__cspPhase = "page load";
    document.addEventListener("securitypolicyviolation", function (e) {
      window.__cspViolations.push({
        phase: window.__cspPhase,
        directive: e.effectiveDirective,
        blocked: (e.blockedURI || "").substring(0, 120),
        source: (e.sourceFile || "") + ":" + e.lineNumber,
        sample: (e.sample || "").substring(0, 200)
      });
    });
  </script>

  <script defer type="module" nonce="testNonce123">
    import React from "https://esm.sh/react@19/?dev";
    import ReactDOMClient from "https://esm.sh/react-dom@19/client?dev";
    import ReactDOM from "https://esm.sh/react-dom@19?dev";
    window.ReactDOMClient = ReactDOMClient;
    window.React = React;
    window.ReactDOM = ReactDOM;
  </script>

  <link rel="stylesheet" type="text/css" href="../node_modules/survey-core/survey-core.css" />
  <link rel="stylesheet" type="text/css" href="../node_modules/survey-creator-core/survey-creator-core.css" />

  <style nonce="testNonce123">
    *,
    ::after,
    ::before {
      box-sizing: border-box;
    }

    #survey-creator {
      height: 70vh;
    }

    #standalone-survey {
      margin-top: 16px;
    }
  </style>

  <script src="../node_modules/survey-core/survey.core.js" defer></script>
  <script src="../node_modules/survey-core/survey.i18n.js" defer></script>
  <script src="../node_modules/survey-core/themes/index.js" defer></script>
  <script src="../node_modules/survey-creator-core/survey-creator-core.js" defer></script>
  <script src="../node_modules/survey-creator-core/survey-creator-core.i18n.js" defer></script>
  <script src="../node_modules/survey-react-ui/survey-react-ui.js" defer></script>
  <script src="../build/survey-creator-react.js" defer></script>
</head>

<body spellcheck="false">
  <div id="survey-creator"></div>
  <!-- A plain survey rendered outside the creator: checks that a standalone
       survey renders cleanly under the same strict policy. -->
  <div id="standalone-survey"></div>
</body>
<script nonce="testNonce123">
  window.addEventListener("DOMContentLoaded", () => {
    window.surveyJSFramework = "react";
    SurveyCreatorCore.registerSurveyTheme(SurveyTheme);
    SurveyCreatorCore.registerCreatorTheme(SurveyTheme);

    const creator = new SurveyCreator.SurveyCreator({
      expandCollapseButtonVisibility: "never",
      showLogicTab: true,
      showTranslationTab: true,
      showThemeTab: true
    });
    creator.tabResponsivenessMode = "menu";
    creator["animationEnabled"] = false;
    creator.allowZoom = false;
    const query = new URLSearchParams(location.search);
    // ?empty=1 leaves the survey without elements so that the empty-state
    // placeholder illustrations (background: url(data:image/png)) render on every tab.
    window.__cspEmptyMode = query.get("empty") === "1";
    // ?shadow=1 mounts the creator inside a shadow root with its own stylesheet links,
    // the setup documented for shadow-DOM consumers. The document-level stylesheet does
    // not reach inside, so this exercises the CSSOM fallback that delivers the variables.
    window.__cspShadowMode = query.get("shadow") === "1";
    creator.JSON = window.__cspEmptyMode ? {} : {
      elements: [
        { type: "text", name: "q1", title: "Text question" },
        {
          // imagemap writes CSS variables via setAttribute("style", ...) on its SVG,
          // which a nonce-based style-src blocks (style-src-attr).
          type: "imagemap",
          name: "q2",
          imageLink: "./imagemap-test.png",
          idleFillColor: "#ff0000",
          hoverFillColor: "#00ff00",
          areas: [{ value: "a1", shape: "rect", coords: "10,10,100,100" }]
        }
      ]
    };
    window.creator = creator;
    const creatorContainer = document.getElementById("survey-creator");
    let creatorMount = creatorContainer;
    if (window.__cspShadowMode) {
      // Deliberately no stylesheet inside the shadow root: the document-level one cannot
      // reach in, so the variables must arrive through the runtime CSSOM fallback - an
      // adopted stylesheet on the shadow root, which a strict style-src does not police.
      const shadowRoot = creatorContainer.attachShadow({ mode: "open" });
      const shadowHost = document.createElement("div");
      shadowHost.style.height = "70vh";
      shadowRoot.appendChild(shadowHost);
      creatorMount = shadowHost;
    }
    ReactDOMClient.createRoot(creatorMount).render(
      React.createElement(SurveyCreator.SurveyCreatorComponent, { creator: creator })
    );

    if (!window.__cspEmptyMode) {
      const standaloneSurvey = new Survey.Model({
        elements: [{ type: "text", name: "s1", title: "Standalone survey question" }]
      });
      standaloneSurvey.applyTheme(SurveyTheme.FlatLight);
      window.standaloneSurvey = standaloneSurvey;
      ReactDOMClient.createRoot(document.getElementById("standalone-survey")).render(
        React.createElement(SurveyReact.Survey, { model: standaloneSurvey })
      );
    }
  });
</script>

</html>
