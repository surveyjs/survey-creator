<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script defer type="module">
    import React from "https://esm.sh/react@19/?dev";
    import ReactDOMClient from "https://esm.sh/react-dom@19/client?dev";
    import ReactDOM from "https://esm.sh/react-dom@19?dev";
    window.ReactDOMClient = ReactDOMClient;
    window.React = React;
    window.ReactDOM = ReactDOM;
  </script>
  <link rel="stylesheet" type="text/css" href="../node_modules/survey-core/survey-core.css" />
  <link rel="stylesheet" type="text/css" href="../node_modules/survey-creator-core/survey-creator-core.css" />
  <!-- survey-creator-core embeds no @font-face rule; the page supplies Open Sans itself.
       Pinned to the files the reference screenshots were taken with - see fonts.css. -->
  <link rel="stylesheet" type="text/css" href="../fonts.css" />
  <script src="../node_modules/survey-core/survey.core.js" defer></script>
  <script src="../node_modules/survey-core/themes/index.js" defer></script>
  <script src="../node_modules/survey-creator-core/survey-creator-core.js" defer></script>
  <script src="../node_modules/survey-react-ui/survey-react-ui.js" defer></script>
  <script src="../build/survey-creator-react.js" defer></script>
  <script src="./sc.js" defer></script>
</head>

<body spellcheck="false">
  <div id="survey-creator" style="position: fixed; top: 0; left: 0; right: 0; bottom: 0;"></div>
</body>
<script>
  // Filter control prototype (#11890) inside Survey Creator - the same survey as survey-react-ui's
  // filter.html. The products of the public OData Northwind service reach the matrix through a data
  // source that declares paging, filtering and sorting, so the filter, the sort and the page all run on
  // the server: the filter arrives as a survey expression (the authored one and the control's, bracketed
  // and joined) and is translated into $filter here. A data source is not part of the JSON,
  // and every tab builds a survey of its own, so it is attached to each Preview and Themes survey as
  // Creator creates it; the designer surface reads no data. Two buttons in Creator's toolbar keep that
  // survey's uiState (the filter's preset, search and edits) in localStorage across reloads.
  // The first page has the presets; the next three filter the same products with no presets, by the
  // quick filters alone, with the search, and with the advanced editor; the last one puts the quick
  // filters over a fixed matrix whose rows are local data, with no server at all.
  // The last three pages read DummyJSON (https://dummyjson.com/docs/products), an API that pages and
  // sorts by one field but filters only by a search or by one category. Each declares less of it: paging
  // and sorting with no filter (the list reads everything while a filter is set), all three with a filter
  // DummyJSON refuses beyond what it can do, and nothing at all (the list does everything itself).
  var ODATA = "https://services.odata.org/V4/Northwind/Northwind.svc/";
  // Record field -> OData property. The record is flat; Category is a navigation property.
  var fieldMap = { name: "ProductName", category: "Category/CategoryName", quantity: "QuantityPerUnit",
    price: "UnitPrice", stock: "UnitsInStock", discontinued: "Discontinued" };
  var comparisons = { equal: "eq", notequal: "ne", greater: "gt", less: "lt", greaterorequal: "ge", lessorequal: "le" };

  function odataLiteral(value) {
    if (value === null || value === undefined) return "null";
    if (typeof value === "number" || typeof value === "boolean") return String(value);
    return "'" + String(value).replace(/'/g, "''") + "'";
  }
  function untranslatable(op) {
    throw new Error("No OData for: " + (!!op ? op.toString() : "a missing operand"));
  }
  // The right side of a comparison must be a value: a field, an arithmetic or a function there reads
  // as a value too (its name, or null) and would filter by something nobody asked for.
  function constValue(op) {
    if (!op || op.getType() !== "const") untranslatable(op);
    return op.correctValue;
  }
  function odataField(op) {
    if (op.getType() !== "variable" || !fieldMap[op.variable]) untranslatable(op);
    return fieldMap[op.variable];
  }
  function constValues(op) {
    return !!op && op.getType() === "array" ? op.values.map(constValue) : [constValue(op)];
  }
  // Every node the filter control composes has an OData form here; anything else is refused, so a
  // filter is never silently narrowed to the part that happened to translate.
  function toOData(op) {
    var type = op.getType();
    if (type === "binary") {
      var name = op.operator;
      if (name === "and" || name === "or") {
        return "(" + toOData(op.leftOperand) + " " + name + " " + toOData(op.rightOperand) + ")";
      }
      var field = odataField(op.leftOperand);
      if (comparisons[name]) return field + " " + comparisons[name] + " " + odataLiteral(constValue(op.rightOperand));
      if (name === "contains" || name === "notcontains") {
        // OData contains() is case-sensitive, a survey expression's is not.
        var text = "contains(tolower(" + field + "), " + odataLiteral(String(constValue(op.rightOperand)).toLowerCase()) + ")";
        return name === "contains" ? text : "not " + text;
      }
      if (name === "anyof" || name === "noneof") {
        // Northwind has no "in": a set is a chain of eq.
        var anyOf = "(" + constValues(op.rightOperand).map(function (v) { return field + " eq " + odataLiteral(v); }).join(" or ") + ")";
        return name === "anyof" ? anyOf : "not " + anyOf;
      }
    }
    // The quick search composes a bare "false" when no field can match what was typed.
    if (type === "const" && typeof op.correctValue === "boolean") return String(op.correctValue);
    if (type === "unary") {
      if (op.operator === "empty") return odataField(op.expression) + " eq null";
      if (op.operator === "notempty") return odataField(op.expression) + " ne null";
      if (op.operator === "negate") return "not (" + toOData(op.expression) + ")";
    }
    untranslatable(op);
  }
  window.filterToOData = function (expression) {
    var operand = new Survey.ConditionsParser().parseExpression(expression);
    if (!operand) throw new Error("Not a survey expression: " + expression);
    return toOData(operand);
  };

  function toRecord(p) {
    return { id: p.ProductID, name: p.ProductName, category: p.Category ? p.Category.CategoryName : null,
      quantity: p.QuantityPerUnit, price: p.UnitPrice, stock: p.UnitsInStock, discontinued: p.Discontinued };
  }
  function readJson(url) {
    return fetch(url).then(function (res) {
      if (!res.ok) throw new Error("HTTP " + res.status + " " + res.statusText);
      return res.json();
    });
  }
  var productsSource = {
    keyField: "id",
    // Without the three flags the list would read every product once and filter, sort and page them
    // itself; with them every page, filter and sort is one request to the server.
    capabilities: { paging: true, filtering: true, sorting: true },
    read: function (request) {
      try {
        var params = ["$count=true", "$expand=Category($select=CategoryName)",
          "$select=ProductID,ProductName,QuantityPerUnit,UnitPrice,UnitsInStock,Discontinued"];
        if (!!request.filter) {
          params.push("$filter=" + encodeURIComponent(window.filterToOData(request.filter)));
        }
        if (request.sort.length > 0) {
          params.push("$orderby=" + encodeURIComponent(request.sort.map(function (s) { return fieldMap[s.field] + " " + s.direction; }).join(",")));
        }
        if (request.skip > 0) params.push("$skip=" + request.skip);
        if (request.take > 0) params.push("$top=" + request.take);
        var url = ODATA + "Products?" + params.join("&");
        console.log("odata", JSON.stringify(request.filter), "->", decodeURIComponent(url));
        return readJson(url).then(function (data) {
          showDataError("");
          return { total: data["@odata.count"], records: data.value.map(toRecord) };
        });
      } catch (e) {
        // A filter that does not translate is a failed read, reported through onDynamicDataError.
        return Promise.reject(e);
      }
    }
  };

  // DummyJSON pages and sorts by one field, but filters only by a search over the title and the
  // description (q) or by one category: no comparisons, no two categories, no search inside a category.
  var DUMMY = "https://dummyjson.com/products";
  // The record fields are the API's own, so a sort or a filter field needs no mapping.
  var dummySelect = "id,title,description,category,brand,price,stock,rating";
  // The text of a search: contains over the title, the description or both, with one text - what the
  // control's search box composes. q always looks in both fields, so a condition on the title alone can
  // bring back more rows than it asks for.
  function dummySearchText(op) {
    if (op.getType() !== "binary") return undefined;
    if (op.operator === "or") {
      var left = dummySearchText(op.leftOperand);
      return left !== undefined && left === dummySearchText(op.rightOperand) ? left : undefined;
    }
    var field = op.leftOperand;
    if (op.operator !== "contains" || field.getType() !== "variable" ||
      (field.variable !== "title" && field.variable !== "description")) return undefined;
    return !!op.rightOperand && op.rightOperand.getType() === "const" ? String(op.rightOperand.correctValue) : undefined;
  }
  // One category: "=" or an anyof of a single value.
  function dummyCategory(op) {
    if (op.getType() !== "binary" || op.leftOperand.getType() !== "variable" || op.leftOperand.variable !== "category") return undefined;
    var right = op.rightOperand;
    if (!right) return undefined;
    if (op.operator === "equal" && right.getType() === "const") return String(right.correctValue);
    if (op.operator === "anyof" && right.getType() === "array" && right.values.length === 1 &&
      right.values[0].getType() === "const") return String(right.values[0].correctValue);
    return undefined;
  }
  // The endpoint and the parameters a filter maps to. Anything DummyJSON has no endpoint for is refused,
  // so a filter is never silently narrowed to the part the server happens to understand.
  function dummyFilterTarget(expression) {
    if (!expression) return { path: "", params: [] };
    var op = new Survey.ConditionsParser().parseExpression(expression);
    if (!op) throw new Error("Not a survey expression: " + expression);
    var text = dummySearchText(op);
    if (text !== undefined) return { path: "/search", params: ["q=" + encodeURIComponent(text)] };
    var category = dummyCategory(op);
    if (category !== undefined) return { path: "/category/" + encodeURIComponent(category), params: [] };
    throw new Error("DummyJSON filters by a search or by one category, not by: " + op.toString());
  }
  function readDummy(request) {
    try {
      if (request.sort.length > 1) throw new Error("DummyJSON sorts by one field only");
      var target = dummyFilterTarget(request.filter);
      // take is 0 for "everything from skip", and so is DummyJSON's limit.
      var params = target.params.concat(["select=" + dummySelect, "limit=" + request.take]);
      if (request.skip > 0) params.push("skip=" + request.skip);
      if (request.sort.length > 0) {
        params.push("sortBy=" + encodeURIComponent(request.sort[0].field), "order=" + request.sort[0].direction);
      }
      var url = DUMMY + target.path + "?" + params.join("&");
      console.log("dummyjson", JSON.stringify(request.filter), "->", decodeURIComponent(url));
      return readJson(url).then(function (data) {
        showDataError("");
        return { total: data.total, records: data.products };
      });
    } catch (e) {
      return Promise.reject(e);
    }
  }
  // The same API declared three ways. Without filtering the list reads every product while a filter is
  // set and filters them itself; with it every filter goes to DummyJSON, which refuses what it cannot do;
  // without paging the list reads every product once and does everything on its side.
  var dummyNoFilterSource = { keyField: "id", capabilities: { paging: true, sorting: true }, read: readDummy };
  var dummyServerFilterSource = { keyField: "id", capabilities: { paging: true, filtering: true, sorting: true }, read: readDummy };
  var dummyNoPagingSource = { keyField: "id", read: readDummy };

  // A failed read keeps the previous rows on screen, so without this the new filter would look applied.
  function showDataError(message) {
    var el = document.getElementById("dataError");
    if (!el) {
      el = document.createElement("div");
      el.id = "dataError";
      el.style.cssText = "position: fixed; left: 16px; right: 16px; bottom: 16px; z-index: 3000; padding: 8px 12px; " +
        "background: #fde8e8; color: #9b1c1c; border: 1px solid #f8b4b4; border-radius: 4px; font: 14px sans-serif;";
      document.body.appendChild(el);
    }
    el.textContent = !!message ? "The filter was not applied: " + message : "";
    el.style.display = !!message ? "block" : "none";
  }

  var UI_STATE_KEY = "surveyjs-creator-filter-demo-uiState";
  // The survey whose uiState is saved and restored is the one the Preview (or Themes) tab shows now.
  // Every localStorage call is guarded - a private window or blocked site data throws on access.
  function saveUIState(creator, model) {
    try {
      localStorage.setItem(UI_STATE_KEY, JSON.stringify(model.uiState));
      creator.notify("uiState saved");
    } catch (e) {
      creator.notify("Could not save uiState: " + e.message, "error");
    }
  }
  function restoreUIState(creator, model) {
    try {
      var text = localStorage.getItem(UI_STATE_KEY);
      if (!text) {
        creator.notify("No uiState saved yet");
        return;
      }
      model.uiState = JSON.parse(text);
      creator.notify("uiState restored");
    } catch (e) {
      creator.notify("Could not restore uiState: " + e.message, "error");
    }
  }

  // The columns of every products matrix; a new array per call, so no two matrices share one.
  function productColumns(categories) {
    return [
      { name: "name", title: "Product", cellType: "text", filterOperators: ["contains"] },
      // Picked from a list of checkboxes and nothing else: anyof is the only operator the filter offers.
      { name: "category", title: "Category", cellType: "dropdown", choices: categories, filterOperators: ["anyof"] },
      { name: "quantity", title: "Quantity per unit", cellType: "text" },
      { name: "price", title: "Price", cellType: "text", inputType: "number" },
      { name: "stock", title: "In stock", cellType: "text", inputType: "number" },
      { name: "discontinued", title: "Discontinued", cellType: "boolean", filterOperators: ["equal"] }];
  }
  // The columns of every DummyJSON matrix. filterable, when given, names the only columns a filter may
  // offer: the rest opt out with allowFiltering, so the control shows nothing the server cannot filter by.
  function dummyColumns(categories, filterable) {
    var columns = [
      { name: "title", title: "Title", cellType: "text", filterOperators: ["contains"] },
      { name: "description", title: "Description", cellType: "text", filterOperators: ["contains"] },
      // One category at a time: that is all DummyJSON can filter by.
      { name: "category", title: "Category", cellType: "dropdown", choices: categories, filterOperators: ["equal"] },
      { name: "brand", title: "Brand", cellType: "text" },
      { name: "price", title: "Price", cellType: "text", inputType: "number" },
      { name: "stock", title: "In stock", cellType: "text", inputType: "number" },
      { name: "rating", title: "Rating", cellType: "text", inputType: "number" }];
    if (!!filterable) {
      columns.forEach(function (column) {
        if (filterable.indexOf(column.name) < 0) column.allowFiltering = false;
      });
    }
    return columns;
  }
  // The source of every matrix that reads its rows from a server, by matrix name. Each matrix keeps a
  // list of its own and sends its own requests, so the Northwind ones share the one data source.
  var dataSources = {
    "products": productsSource, "products-quick": productsSource, "products-search": productsSource,
    "products-advanced": productsSource, "dummy-no-filter": dummyNoFilterSource,
    "dummy-search-or-category": dummyServerFilterSource, "dummy-no-paging": dummyNoPagingSource
  };

  function renderCreator(categories, dummyCategories) {
    var json = { pages: [
      { name: "presets", title: "Presets, search and the advanced editor", elements: [
        { type: "filter", name: "products-filter", title: "Filter products", source: "products", showSearch: true,
          // Text and choice fields only: a quick search over a number or a boolean would send contains()
          // on a decimal, which OData refuses.
          searchFields: ["name", "category", "quantity"],
          items: [
            { name: "cheap-beverages", title: "Cheap beverages", expression: "{category} anyof ['Beverages'] and {price} < 20" },
            { name: "out-of-stock", title: "Out of stock", expression: "{stock} = 0" },
            { name: "available", title: "Available", expression: "{stock} > 0 and {discontinued} = false" },
            { name: "edges", title: "Cheap or premium (raw)", expression: "{price} < 10 or {price} > 100" },
            { name: "ai", title: "AI: discontinued", type: "ai", prompt: "discontinued products", expression: "{discontinued} = true", allowEdit: false }
          ] },
        { type: "matrixdynamic", name: "products", title: "Products (OData Northwind)", rowsPerPage: 10, columns: productColumns(categories) }
      ] },
      // No items: the presets row has no presets and shows only Clear, once a field has a condition.
      // No search box (showSearch is off by default) and no Advanced button: a badge per field and nothing else.
      { name: "quick-only", title: "Quick filters only", elements: [
        { type: "filter", name: "quick-filter", title: "Filter products", source: "products-quick", allowAdvancedMode: false },
        { type: "matrixdynamic", name: "products-quick", title: "Products (OData Northwind)", rowsPerPage: 10, columns: productColumns(categories) }
      ] },
      { name: "quick-search", title: "Quick filters and search", elements: [
        { type: "filter", name: "search-filter", title: "Filter products", source: "products-search", showSearch: true,
          // The same fields as on the first page, for the same reason: OData refuses contains() on a decimal.
          searchFields: ["name", "category", "quantity"], allowAdvancedMode: false },
        { type: "matrixdynamic", name: "products-search", title: "Products (OData Northwind)", rowsPerPage: 10, columns: productColumns(categories) }
      ] },
      // The Advanced button is on by default, so only the presets and the search are left out.
      { name: "quick-advanced", title: "Quick filters and the advanced editor", elements: [
        { type: "filter", name: "advanced-filter", title: "Filter products", source: "products-advanced" },
        { type: "matrixdynamic", name: "products-advanced", title: "Products (OData Northwind)", rowsPerPage: 10, columns: productColumns(categories) }
      ] },
      // A fixed matrix with no data source: its rows are the records, its columns the fields, and the
      // list filters the cells of its value right here, with no request to anyone.
      { name: "fixed-matrix", title: "Quick filters over a fixed matrix (local data)", elements: [
        { type: "filter", name: "supplies-filter", title: "Filter supplies", source: "supplies", allowAdvancedMode: false },
        { type: "matrixdropdown", name: "supplies", title: "Office supplies (local data)",
          rows: [{ value: "pens", text: "Pens" }, { value: "paper", text: "Paper" }, { value: "stapler", text: "Stapler" },
            { value: "toner", text: "Toner" }, { value: "notebooks", text: "Notebooks" }, { value: "markers", text: "Markers" },
            { value: "folders", text: "Folders" }, { value: "tape", text: "Tape" }],
          columns: [
            { name: "category", title: "Category", cellType: "dropdown", choices: ["Writing", "Paper", "Equipment"], filterOperators: ["anyof"] },
            { name: "price", title: "Price", cellType: "text", inputType: "number" },
            { name: "stock", title: "In stock", cellType: "text", inputType: "number" },
            { name: "reorder", title: "Reorder", cellType: "boolean", filterOperators: ["equal"] }],
          defaultValue: {
            pens: { category: "Writing", price: 2.5, stock: 120, reorder: false },
            paper: { category: "Paper", price: 6, stock: 0, reorder: true },
            stapler: { category: "Equipment", price: 12, stock: 8, reorder: false },
            toner: { category: "Equipment", price: 85, stock: 0, reorder: true },
            notebooks: { category: "Paper", price: 4, stock: 45, reorder: false },
            markers: { category: "Writing", price: 3.2, stock: 3, reorder: true },
            folders: { category: "Paper", price: 1.5, stock: 200, reorder: false },
            tape: { category: "Equipment", price: 2, stock: 30, reorder: false }
          } }
      ] },
      { name: "dummy-no-filter", title: "DummyJSON: paging and sorting, no server filter",
        description: "The source declares paging and sorting only: with no filter every page is a request, and while a filter is set the list reads all 194 products and filters them itself.",
        elements: [
          { type: "filter", name: "dummy-no-filter-filter", title: "Filter products", source: "dummy-no-filter", showSearch: true,
            searchFields: ["title", "brand"],
            // Comparisons DummyJSON has no parameter for; they work here because the list does the filtering.
            items: [
              { name: "cheap", title: "Under $10", expression: "{price} < 10" },
              { name: "top-rated", title: "Top rated", expression: "{rating} >= 4.5" }
            ] },
          { type: "matrixdynamic", name: "dummy-no-filter", title: "Products (DummyJSON)", rowsPerPage: 10, columns: dummyColumns(dummyCategories) }
        ] },
      { name: "dummy-search-or-category", title: "DummyJSON: the server filters by a search or one category",
        description: "The source declares filtering, so every filter goes to DummyJSON, which takes a search or one category and nothing else: a search inside a category, or the Under $10 preset, is refused.",
        elements: [
          { type: "filter", name: "dummy-server-filter", title: "Filter products", source: "dummy-search-or-category", showSearch: true,
            // The two fields DummyJSON's q looks in, so the search box asks the server exactly what it answers.
            searchFields: ["title", "description"], allowChangeSearchFields: false, allowAdvancedMode: false,
            items: [
              { name: "smartphones", title: "Smartphones", expression: "{category} = 'smartphones'" },
              { name: "laptops", title: "Laptops", expression: "{category} = 'laptops'" },
              { name: "under-10", title: "Under $10 (the server cannot)", expression: "{price} < 10" }
            ] },
          { type: "matrixdynamic", name: "dummy-search-or-category", title: "Products (DummyJSON)", rowsPerPage: 10,
            columns: dummyColumns(dummyCategories, ["title", "description", "category"]) }
        ] },
      { name: "dummy-no-paging", title: "DummyJSON: no paging, everything on the client",
        description: "The source declares nothing: the list reads all 194 products once, and the pages, the filter and the search make no request.",
        elements: [
          { type: "filter", name: "dummy-no-paging-filter", title: "Filter products", source: "dummy-no-paging", showSearch: true,
            searchFields: ["title", "brand"],
            items: [{ name: "cheap", title: "Under $10", expression: "{price} < 10" }] },
          { type: "matrixdynamic", name: "dummy-no-paging", title: "Products (DummyJSON)", rowsPerPage: 10, columns: dummyColumns(dummyCategories) }
        ] }
    ] };
    var creator = new SurveyCreator.SurveyCreator({ showLogicTab: true, showTranslationTab: true });
    var previewSurvey = null;
    // Raised once the survey has its JSON, so the matrices are already there. A matrix that was renamed
    // or removed simply gets no data source.
    creator.onSurveyInstanceCreated.add(function (_, options) {
      if (options.reason !== "preview" && options.reason !== "theme") return;
      var model = options.survey;
      previewSurvey = model;
      showDataError("");
      Object.keys(dataSources).forEach(function (name) {
        var matrix = model.getQuestionByName(name);
        if (!!matrix) matrix.dataSource = dataSources[name];
      });
      model.onDynamicDataError.add(function (_, options) {
        console.error("data source", options.operation, String(options.error));
        showDataError(String(options.error && options.error.message || options.error));
      });
      model.onFilterChanged.add(function (_, options) { console.log("filter", options.question.name, options.filterExpression); });
      model.onUIStateChanged.add(function () { console.log("uiState", JSON.stringify(model.uiState)); });
    });
    // Creator's own toolbar holds the uiState buttons; they are shown only on the tabs that run the survey.
    var uiStateActions = [
      new Survey.Action({ id: "save-ui-state", title: "Save uiState", visible: false,
        action: function () { saveUIState(creator, previewSurvey); } }),
      new Survey.Action({ id: "restore-ui-state", title: "Restore uiState", visible: false,
        action: function () { restoreUIState(creator, previewSurvey); } })
    ];
    uiStateActions.forEach(function (action) { creator.toolbarItems.push(action); });
    creator.onActiveTabChanged.add(function (_, options) {
      var isSurveyTab = options.tabName === "preview" || options.tabName === "theme";
      uiStateActions.forEach(function (action) { action.visible = isSurveyTab; });
      // Leaving the tab leaves its survey behind, and its read error with it.
      if (!isSurveyTab) {
        previewSurvey = null;
        showDataError("");
      }
    });
    creator.JSON = json;
    window.creator = creator;
    const root = ReactDOMClient.createRoot(document.getElementById("survey-creator"));
    root.render(React.createElement(SurveyCreator.SurveyCreatorComponent, { creator: creator }));
  }

  window.addEventListener("DOMContentLoaded", () => {
    window.surveyJSFramework = "react";
    SurveyCreatorCore.registerSurveyTheme(SurveyTheme);
    SurveyCreatorCore.registerCreatorTheme(SurveyTheme);
    // The DummyJSON pages do without their categories rather than take the Northwind pages down with them.
    var dummyCategories = readJson(DUMMY + "/categories").then(function (list) {
      return list.map(function (c) { return { value: c.slug, text: c.name }; });
    }).catch(function (e) {
      console.error("Could not load the DummyJSON categories:", e.message);
      return [];
    });
    Promise.all([readJson(ODATA + "Categories?$select=CategoryName"), dummyCategories]).then(function (res) {
      renderCreator(res[0].value.map(function (c) { return c.CategoryName; }), res[1]);
    }).catch(function (e) {
      document.getElementById("survey-creator").textContent = "Could not load the Northwind categories: " + e.message;
    });
  });
</script>

</html>
