<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- survey-creator-core embeds no @font-face rule; the page supplies Open Sans itself.
       Pinned to the files the reference screenshots were taken with - see fonts.css. -->
  <link rel="stylesheet" type="text/css" href="../fonts.css" />

  <!-- <link rel="stylesheet" type="text/css" href="../build/survey-creator-js.min.css" /> -->
  <style>
        /*imitation of Tailwind CSS, bootstrap and other CSS frameworks (only for survey-creator-js)*/
        *,
        ::after,
        ::before { 
            box-sizing: border-box;
        }
  </style>
  <script src="../node_modules/survey-core/survey.core.js"></script>
  <script src="../node_modules/survey-core/survey.i18n.js"></script>
  <script src="../node_modules/survey-core/themes/index.js"></script>
  <script src="../node_modules/survey-creator-core/survey-creator-core.js"></script>
  <script src="../node_modules/survey-js-ui/survey-js-ui.js"></script>
  <script src="../build/survey-creator-js.js"></script>
  <script src="./sc.js"></script>
</head>

<body spellcheck="false">
  <div id="survey-creator"></div>
</body>
<script>
  window.surveyJSFramework = "react";
  SurveyCreatorCore.registerSurveyTheme(SurveyTheme);
    SurveyCreatorCore.registerCreatorTheme(SurveyTheme);
  // The page's creator. The first load and resetCreatorForReuse() both build it here, so they can't drift apart.
  const createDefaultCreator = () => {
    const creator = new SurveyCreator.SurveyCreator({ expandCollapseButtonVisibility: "never", showLogicTab: true, showTranslationTab: true });
    creator.tabResponsivenessMode = "menu";
    creator["animationEnabled"] = false;
    creator.showOneCategoryInPropertyGrid = false;
    creator.allowZoom = false;
    return creator;
  };
  const creator = createDefaultCreator();
  window.creator = creator;
  window.creatorResetCount = 0;

  class SurveyCreatorRenderComponent extends SurveyUI.Component {
    constructor(props) {
      super(props);
      this.state = { creator: creator };
      // Used by the e2e fixture (e2e/helper.ts) to reuse this page for the next test. After a test,
      // releaseCreatorForReuse() unmounts the creator and disposes it (and the one updateCreatorModel replaced);
      // the next test's resetCreatorForReuse() renders a new default creator in a new component instance. Each
      // bumps window.creatorResetCount once it's done. The creators are disposed in a timer of their own, so an
      // error there is an uncaught page error.
      window.releaseCreatorForReuse = () => {
        const oldCreators = [window.creator, window.prevCreator];
        this.setState({ creator: undefined }, () => setTimeout(() => {
          try {
            oldCreators.forEach(c => c && !c.isDisposed && c.dispose());
          } finally {
            window.creatorResetCount++;
          }
        }));
        return true;
      };
      window.resetCreatorForReuse = () => {
        const newCreator = createDefaultCreator();
        window.creator = newCreator;
        window.prevCreator = undefined;
        this.setState({ creator: newCreator }, () => window.creatorResetCount++);
        return true;
      };
      window.updateCreatorModel = (options, json) => {
        window.prevCreator = window.creator;
        const creator = new SurveyCreator.SurveyCreator(options);
              creator.JSON = json;
        this.setState({ creator });
        creator.tabResponsivenessMode = "menu";
        creator["animationEnabled"] = false;
        creator.showOneCategoryInPropertyGrid = false;
        creator.allowZoom = false;
        window.creator = creator;
      }
    }
    render() {
      return this.state.creator ? SurveyUI.createElement(SurveyCreator.SurveyCreatorComponent, { creator: this.state.creator }) : null;
    }
  }
  // SurveyCreator.renderSurveyCreator(creator, document.getElementById("survey-creator"));
  const survey = SurveyUI.createElement(SurveyCreatorRenderComponent, { creator });

  const container = document.getElementById("survey-creator");
  const shadowRoot = container.attachShadow({ mode: "open" });
  const rootElement = document.createElement("div");
  rootElement.style.position = "fixed";
  rootElement.style.top = "0";
  rootElement.style.left = "0";
  rootElement.style.right = "0";
  rootElement.style.bottom = "0";
  

  const styles = document.createElement("style");
        styles.textContent = `
          *,
          ::after,
          ::before {
              box-sizing: border-box;
          }
        `;
  shadowRoot.appendChild(styles);

  const surveyLink = document.createElement("link");
  surveyLink.setAttribute("rel", "stylesheet");
  surveyLink.setAttribute("href", "../node_modules/survey-core/survey-core.min.css");
  shadowRoot.appendChild(surveyLink);

  const creatorLink = document.createElement("link");
  creatorLink.setAttribute("rel", "stylesheet");
  creatorLink.setAttribute("href", "../node_modules/survey-creator-core/survey-creator-core.min.css");
  shadowRoot.appendChild(creatorLink);

  shadowRoot.appendChild(rootElement);

  // Render once both stylesheets have loaded: the tab bar measures its items only once, after the first
  // render, and items measured without the creator CSS keep it collapsed into a menu.
  Promise.all([surveyLink, creatorLink].map(link => new Promise(resolve => {
    link.addEventListener("load", resolve);
    link.addEventListener("error", resolve);
  }))).then(() => SurveyUI.render(survey, rootElement));
</script>

</html>
