name: Bug report
description: SurveyJS Survey Creator behaves incorrectly.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Please don't include application code, credentials or real data. Reduce the case to a minimal survey JSON, the Survey Creator options and the SurveyJS calls that reproduce it.
        Form Library issues (a survey that behaves the same without Survey Creator) go to https://github.com/surveyjs/survey-library/issues. Report security issues by email to info@devsoftbaltic.com, not in public issues.
  - type: input
    id: versions
    attributes:
      label: Package versions and framework
      description: For example, survey-creator-core 3.2.7, survey-creator-angular 3.2.7, Angular 19.
      placeholder: survey-creator-core 3.2.7, survey-creator-react 3.2.7, React 19
    validations:
      required: true
  - type: textarea
    id: json
    attributes:
      label: Minimal survey JSON and creator options
      description: The smallest survey JSON and the Survey Creator options (ICreatorOptions) that reproduce the bug.
      render: json
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the Designer tab.
        2. Select question1 and change "Title" in the property grid.
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected-actual
    attributes:
      label: Expected vs. actual behavior
      description: What you expected to happen, and what happened instead.
    validations:
      required: true
